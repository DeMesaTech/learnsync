<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/gmvcc.png">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LearnSync | AI Assistant</title>

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/lms.css">
</head>

<body class="ai-shell h-screen overflow-hidden text-slate-900 font-sans text-sm">
    <main class="flex h-screen" x-data="aiApp()">
        <aside class="fixed inset-y-0 left-0 z-40 w-72 border-r border-slate-200 bg-white shadow-xl transition-transform duration-300 md:static md:translate-x-0 md:shadow-none"
            :class="historyOpen ? 'translate-x-0' : '-translate-x-full'">
            <div class="flex h-full flex-col">
                <div class="flex h-16 items-center gap-3 border-b border-slate-200 px-4">
                    <a href="dashboard.html" class="grid h-10 w-10 place-items-center rounded-full text-slate-600 transition hover:bg-slate-100 hover:text-slate-900"
                        aria-label="Back to dashboard">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19 8 12l7-7" />
                        </svg>
                    </a>
                    <div class="min-w-0">
                        <h1 class="truncate text-base font-bold text-slate-900">LearnSync AI</h1>
                        <p class="truncate text-xs text-slate-500">Study assistant</p>
                    </div>
                </div>

                <div class="border-b border-slate-200 p-4">
                    <button @click="newChat" type="button" class="flex w-full items-center justify-center gap-2 rounded-xl bg-cyan-700 px-4 py-3 font-semibold text-white transition hover:bg-cyan-800">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m-7-7h14" />
                        </svg>
                        New Chat
                    </button>
                </div>

                <nav class="flex-1 overflow-y-auto p-3" aria-label="Chat history">
                    <p class="px-2 pb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">Recent</p>
                    <p x-show="!conversations.length" class="px-2 py-3 text-xs text-slate-500">No conversations yet.</p>
                    <template x-for="conversation in conversations" :key="conversation.id">
                        <a href="#" @click.prevent="selectConversation(conversation.id)"
                            class="mt-2 block rounded-xl px-3 py-3 text-slate-700 transition hover:bg-slate-100"
                            :class="activeConversationId === conversation.id ? 'bg-cyan-50 text-slate-900 ring-1 ring-cyan-100' : ''">
                            <span class="block truncate font-semibold" x-text="conversation.title"></span>
                            <span class="mt-1 block truncate text-xs text-slate-500" x-text="conversation.messages.length + (conversation.messages.length === 1 ? ' message' : ' messages')"></span>
                        </a>
                    </template>
                </nav>

                <div class="border-t border-slate-200 p-4">
                    <button class="flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left text-slate-600 transition hover:bg-slate-100">
                        <span class="grid h-9 w-9 place-items-center rounded-full bg-slate-200 font-bold text-slate-700">JD</span>
                        <span class="min-w-0">
                            <span class="block truncate font-semibold text-slate-800">Juan Dela Cruz</span>
                            <span class="block truncate text-xs text-slate-500">Student</span>
                        </span>
                    </button>
                </div>
            </div>
        </aside>

        <div x-show="historyOpen" x-transition.opacity @click="historyOpen = false"
            class="fixed inset-0 z-30 bg-slate-900/40 md:hidden"></div>

        <section class="flex min-w-0 flex-1 flex-col">
            <header class="flex h-16 shrink-0 items-center gap-3 border-b border-slate-200 bg-white px-4">
                <button @click="historyOpen = true" class="grid h-10 w-10 place-items-center rounded-full text-slate-600 transition hover:bg-slate-100 md:hidden"
                    aria-label="Open chat history">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7h16M4 12h16M4 17h16" />
                    </svg>
                </button>
                <a href="dashboard.html" class="hidden h-10 w-10 place-items-center rounded-full text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 md:grid"
                    aria-label="Back to dashboard">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19 8 12l7-7" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h2 class="truncate text-base font-bold text-slate-900">AI Assistant</h2>
                    <p class="truncate text-xs text-slate-500">Online and ready to help</p>
                </div>
                <button @click="clearChat" type="button" class="ml-auto hidden rounded-xl border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-600 transition hover:bg-slate-50 sm:block">
                    Clear Chat
                </button>
            </header>

            <div class="flex-1 overflow-y-auto px-4 py-6">
                <div class="mx-auto flex max-w-4xl flex-col gap-5">
                    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
                        <div class="flex items-start gap-4">
                            <div class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-cyan-700 font-bold text-white">AI</div>
                            <div>
                                <h3 class="text-lg font-bold text-slate-900">How can I help you study today?</h3>
                                <p class="mt-1 leading-6 text-slate-600">Ask for summaries, explanations, quiz questions, project ideas, or help organizing your tasks.</p>
                            </div>
                        </div>
                        <div class="mt-5 grid gap-3 sm:grid-cols-2">
                            <button @click="usePrompt('Summarize my lesson notes')" type="button" class="rounded-xl border border-slate-200 px-4 py-3 text-left text-sm font-semibold text-slate-700 transition hover:border-cyan-200 hover:bg-cyan-50">
                                Summarize my lesson notes
                            </button>
                            <button @click="usePrompt('Make a quiz for this topic')" type="button" class="rounded-xl border border-slate-200 px-4 py-3 text-left text-sm font-semibold text-slate-700 transition hover:border-cyan-200 hover:bg-cyan-50">
                                Make a quiz for this topic
                            </button>
                            <button @click="usePrompt('Explain a difficult concept')" type="button" class="rounded-xl border border-slate-200 px-4 py-3 text-left text-sm font-semibold text-slate-700 transition hover:border-cyan-200 hover:bg-cyan-50">
                                Explain a difficult concept
                            </button>
                            <button @click="usePrompt('Help plan my assignment')" type="button" class="rounded-xl border border-slate-200 px-4 py-3 text-left text-sm font-semibold text-slate-700 transition hover:border-cyan-200 hover:bg-cyan-50">
                                Help plan my assignment
                            </button>
                        </div>
                    </section>

                    <template x-for="(message, index) in messages" :key="index">
                        <div :id="`message-${index}`" class="flex items-end gap-3" :class="message.role === 'user' ? 'justify-end' : ''">
                            <template x-if="message.role === 'assistant'">
                                <div class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-cyan-700 text-xs font-bold text-white">AI</div>
                            </template>
                            <div x-text="message.content" class="max-w-[82%] whitespace-pre-wrap rounded-2xl p-4 leading-7 shadow-sm sm:max-w-[75%]" :class="message.role === 'user' ? 'rounded-br bg-cyan-700 text-white' : 'rounded-bl bg-white text-slate-700 ring-1 ring-slate-200'"></div>
                            <template x-if="message.role === 'user'">
                                <div class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-slate-700 text-xs font-bold text-white">You</div>
                            </template>
                        </div>
                    </template>
                    <div x-show="loading" class="flex items-end gap-3">
                        <div class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-cyan-700 text-xs font-bold text-white">AI</div>
                        <div class="rounded-2xl rounded-bl bg-white p-4 text-slate-500 shadow-sm ring-1 ring-slate-200">Thinking...</div>
                    </div>
                    <p x-show="error" x-text="error" class="rounded-xl bg-red-50 p-3 text-red-700 ring-1 ring-red-100"></p>
                </div>
            </div>

            <footer class="shrink-0 border-t border-slate-200 bg-white p-4">
                <form class="mx-auto flex max-w-4xl items-end gap-3" @submit.prevent="sendMessage">
                    <button class="grid h-11 w-11 shrink-0 place-items-center rounded-full border border-slate-200 text-slate-500 transition hover:bg-slate-50"
                        type="button" aria-label="Attach file">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.82l8.48-8.49" />
                        </svg>
                    </button>
                    <textarea x-model="draft" @keydown.enter.exact.prevent="sendMessage" class="max-h-36 min-h-11 flex-1 resize-y rounded-2xl border border-slate-300 bg-slate-50 px-4 py-3 leading-6 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-cyan-600 focus:ring-4 focus:ring-cyan-600/15"
                        rows="1" placeholder="Message LearnSync AI..." aria-label="Message"></textarea>
                    <button :disabled="loading || !draft.trim()" class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-cyan-700 text-white transition hover:bg-cyan-800 disabled:cursor-not-allowed disabled:bg-slate-400"
                        type="submit" aria-label="Send message">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2Zm0 0v-8" />
                        </svg>
                    </button>
                </form>
            </footer>
        </section>
    </main>
    <script>
        function aiApp() {
            return {
                historyOpen: false,
                draft: '',
                loading: false,
                error: '',
                conversations: JSON.parse(localStorage.getItem('learnsync_ai_conversations') || '[]'),
                activeConversationId: null,

                get activeConversation() {
                    return this.conversations.find((conversation) => conversation.id === this.activeConversationId);
                },

                get messages() {
                    return this.activeConversation ? this.activeConversation.messages : [];
                },

                init() {
                    const savedConversation = this.conversations[0];
                    if (savedConversation) this.activeConversationId = savedConversation.id;
                },

                persist() {
                    localStorage.setItem('learnsync_ai_conversations', JSON.stringify(this.conversations));
                },

                newChat() {
                    this.draft = '';
                    this.error = '';
                    this.activeConversationId = null;
                    this.historyOpen = false;
                },

                clearChat() {
                    this.newChat();
                },

                selectConversation(id) {
                    this.activeConversationId = id;
                    this.error = '';
                    this.historyOpen = false;
                    this.scrollToBottom();
                },

                usePrompt(prompt) {
                    this.draft = prompt;
                    this.sendMessage();
                },

                jumpToMessage(index) {
                    document.getElementById(`message-${index}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                },

                scrollToBottom() {
                    this.$nextTick(() => {
                        const container = this.$root.querySelector('.overflow-y-auto.px-4');
                        if (container) container.scrollTop = container.scrollHeight;
                    });
                },

                async sendMessage() {
                    const message = this.draft.trim();
                    if (!message || this.loading) return;

                    this.draft = '';
                    this.error = '';
                    this.loading = true;

                    if (!this.activeConversation) {
                        this.activeConversationId = Date.now();
                        this.conversations.unshift({
                            id: this.activeConversationId,
                            title: message.slice(0, 48) + (message.length > 48 ? '...' : ''),
                            messages: []
                        });
                    }

                    this.activeConversation.messages.push({ role: 'user', content: message });
                    this.persist();
                    this.scrollToBottom();

                    try {
                        const response = await fetch('/api/ai/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ messages: this.messages })
                        });
                        const data = await response.json();
                        if (!response.ok) throw new Error(data.detail || 'The AI request failed.');
                        this.activeConversation.messages.push({ role: 'assistant', content: data.reply });
                        this.persist();
                        this.scrollToBottom();
                    } catch (error) {
                        this.error = error.message;
                        this.activeConversation.messages.pop();
                        if (!this.activeConversation.messages.length) {
                            this.conversations = this.conversations.filter((conversation) => conversation.id !== this.activeConversationId);
                            this.activeConversationId = null;
                        }
                        this.persist();
                    } finally {
                        this.loading = false;
                    }
                }
            };
        }
    </script>
</body>

</html>

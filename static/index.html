<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LearnSync Login</title>
    <link rel="icon" type="image/png" href="/gmvcc.png">

    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="./css/tailwind.css">
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body class="min-h-screen bg-gradient-to-b from-cyan-700 to-sky-600 text-slate-900 font-sans font-sans"
    style="background-image: url('./img/GMVCC.jfif'); background-size: cover; background-position: center; background-repeat: no-repeat;">
    <main class="min-h-screen flex items-center justify-center px-4 py-12" x-data="authApp()">
        <div class="w-full max-w-6xl overflow-hidden rounded-[2rem] bg-slate-900/95 shadow-2xl ring-1 ring-white/10">
            <div class="grid grid-cols-1 xl:grid-cols-[1.1fr_0.9fr]">
                <div
                    class="bg-gradient-to-br from-cyan-700/60 via-sky-600/60 to-indigo-700/60 px-8 py-10 sm:px-12 sm:py-14">
                    <div class="max-w-md text-white">
                        <div class="flex items-center justify-between gap-4">
                            <img src="./img/gmvcc.png" alt="GMVCC Logo" class="h-min w-min shrink-0 rounded-full object-cover">
                            <div class="min-w-0">
                                <p class="mb-4 text-xs uppercase tracking-[0.35em] text-white/70">GOVERNOR MARIANO E. VILLAFUERTE COMMUNITY COLLEGE</p>
                                <h1 class="text-3xl font-semibold sm:text-4xl">LearnSync</h1>
                            </div>
                        </div>
                        <p class="mt-6 text-slate-200 leading-8">Sign in to manage your classes, tasks, and dashboard in
                            one place.</p>
                        <div class="mt-10 rounded-2xl bg-white/10 p-6 text-xs text-slate-200 ring-1 ring-white/10">
                            <p class="font-medium">Tip</p>
                            <p class="mt-3">Enter your email and password to get started with LearnSync.</p>
                        </div>
                        <!-- SOCMED Links -->
                        <div class="mt-6 flex items-center gap-4 text-sm text-slate-200">
                            <a href="https://www.facebook.com/p/Governor-Mariano-E-Villafuerte-Community-College-Libmanan-100064380480187/" target="_blank"
                                class="flex items-center gap-2 underline underline-offset-4 decoration-white/40 transition hover:scale-105 hover:text-white hover:decoration-white">
                                <i class="fa-brands fa-facebook text-lg"></i>
                                <span>Facebook</span>
                            </a>

                            <a href="https://baao.villafuertecolleges.edu.ph/libmanan" target="_blank"
                                class="flex items-center gap-2 underline underline-offset-4 decoration-white/40 transition hover:scale-105 hover:text-white hover:decoration-white">
                                <i class="fa-solid fa-globe text-lg"></i>
                                <span>Website</span>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="px-8 py-10 sm:px-12 sm:py-14">

                    <div class="flex items-center justify-between gap-4 mb-8">
                        <h2 class="text-2xl font-semibold text-white">Access</h2>
                    </div>
                    <!-- Log in -->
                    <section aria-labelledby="login-heading" x-show="page === 'login'" class="space-y-6">
                        <div>
                            <h3 id="login-heading" class="text-lg font-semibold text-white">Log In</h3>
                            <p class="mt-2 text-slate-400">Enter your credentials to continue.</p>
                        </div>
                        <form id="loginForm" @submit.prevent="submitLogin" x-effect="updateLoginValid()"
                            class="space-y-4">
                            <div class="space-y-2">
                                <label for="loginEmail" class="block text-xs font-medium text-slate-300">Email
                                    Address</label>
                                <input type="email" id="loginEmail" x-model="login.email"
                                    placeholder="e.g. juandela.cruz@gmail.com" required
                                    class="w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20" />
                            </div>
                            <div class="space-y-2">
                                <label for="loginPassword"
                                    class="block text-xs font-medium text-slate-300">Password</label>
                                <input type="password" id="loginPassword" x-model="login.password"
                                    placeholder="Enter your password" required
                                    class="w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20" />
                            </div>
                            <button type="submit" id="loginBtn" :disabled="!login.isValid"
                                class="w-full rounded-2xl bg-cyan-500 px-5 py-3 text-sm font-semibold text-white shadow-lg transition hover:bg-cyan-400 disabled:cursor-not-allowed disabled:bg-slate-700">Log
                                In</button>
                        </form>
                    </section>
                </div>
            </div>
        </div>
    </main>

    </main>

    <script>
        function authApp() {
            return {
                page: 'login',
                login: {
                    email: '',
                    password: '',
                    isValid: false
                },

                // ============= LOGIN =============
                updateLoginValid() {
                    this.login.isValid =
                        this.login.email.trim() &&
                        this.login.password.trim();
                },

                submitLogin() {
                    if (this.login.email && this.login.password) {
                        this.submitLoginToBackend();
                    }
                },

                async submitLoginToBackend() {
                    try {
                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                email: this.login.email,
                                password: this.login.password
                            })
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            alert(`Login failed: ${data.detail || 'Invalid credentials'}`);
                            return;
                        }

                        // Store user info in localStorage
                        localStorage.setItem('user_id', data.user_id);
                        localStorage.setItem('role', data.role);
                        localStorage.setItem('name', data.name);
                        if (data.role === 'teacher') {
                            localStorage.setItem('teacher_id', data.teacher_id);
                        }
                        else if (data.role === 'student') {
                            localStorage.setItem('student_id', data.student_id);
                        }


                        // Redirect based on role
                        if (data.role === 'teacher') {
                            window.location.href = './teacher/dashboard.html';

                        } else {
                            window.location.href = './student/dashboard.html';
                        }
                    } catch (error) {
                        console.error('Login error:', error);
                        alert('Network error. Please check if the backend is running.');
                    }
                }
            }
        }
    </script>
</body>

</html>

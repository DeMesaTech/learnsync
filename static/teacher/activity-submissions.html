<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LearnSync | Activity Submissions</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/lms.css">
</head>

<body class="lms-shell teacher-accent font-sans text-sm">
    <div class="pt-20 min-h-screen p-6" x-data="submissionsApp()" x-init="init()">
        <header class="app-header">
            <img src="../img/gmvcc.png" alt="GMVCC logo" class="header-logo" />
            <h1 class="header-title">Activity Submissions</h1>
        </header>

        <nav class="sidebar" :class="open ? 'sidebar-open' : 'sidebar-closed'">
            <ul class="sidebar-list">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon"><svg class="sidebar-brand-icon" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 5h7a3 3 0 0 1 3 3v11a3 3 0 0 0-3-3H4V5Zm16 0h-6a3 3 0 0 0-3 3v11a3 3 0 0 1 3-3h6V5ZM7 9h4M7 13h4M16 9h1M16 13h1" />
                        </svg></div>
                    <div class="sidebar-brand-text"><strong>LearnSync</strong><span>Teacher LMS</span></div>
                </div>
                <li><a class="sidebar-btn" href="dashboard.html"><svg class="sidebar-icon" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 5h16v11H4V5Zm3 14h10M8 9h8M8 12h5" />
                        </svg><span>Dashboard</span></a></li>
                <li><a class="sidebar-btn-active" href="classes.html"><svg class="sidebar-icon" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 4h14v16H5V4Zm4 4h6M9 12h6M9 16h3" />
                        </svg><span>Classes</span></a></li>
                <li><a class="sidebar-btn" href="grading.html"><svg class="sidebar-icon" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 19h16M7 16V8m5 8V5m5 11v-6" />
                        </svg><span>Grading</span></a></li>
                <!-- Account Information -->
                <li><a href="Account.html" @click="open=false" class="sidebar-btn">
                        <svg class="sidebar-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0" />
                        </svg>
                        <span>Account Information</span>
                    </a></li>
                <!-- About -->
                <li><a href="about.html" @click="open=false" class="sidebar-btn">
                        <svg class="sidebar-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0-10v6m0-10h.01" />
                        </svg>
                        <span>About</span>
                    </a></li>
                <!-- Report Bug -->
                <li><a href="report-bug.html" @click="open=false" class="sidebar-btn">
                        <svg class="sidebar-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 8a4 4 0 0 1 8 0v1H8V8Zm-1 1h10v6a5 5 0 0 1-10 0V9Zm-3 2h3m10 0h3M4 17h4m8 0h4M9 4l1.5 2M15 4l-1.5 2M12 9v10" />
                        </svg>
                        <span>Report Bug</span>
                    </a></li>
                <!-- Log Out -->
                <li><a class="sidebar-btn" href="/"><svg class="sidebar-icon" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 12H4m12 0-4 4m4-4-4-4m3-4h2a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-2" />
                        </svg><span>Logout</span></a></li>
            </ul>
        </nav>

        <main class="lms-page mt-8">
            <section class="lms-panel">
                <div class="lms-task-top">
                    <h3 x-text="activityTitle || 'Submissions'">Submissions</h3>
                    <div>
                        <select class="lms-select" x-model="sectionFilter" @change="load()">
                            <option value="all">All sections</option>
                            <template x-for="s in sections" :key="s">
                                <option :value="s">Section <span x-text="s"></span></option>
                            </template>
                        </select>
                    </div>
                </div>

                <div class="lms-list mt-4">
                    <template x-if="loading">
                        <p>Loading submissions...</p>
                    </template>

                    <template x-if="!loading && submissions.length === 0">
                        <p>No enrolled students found.</p>
                    </template>

                    <template x-if="!loading && submissions.length > 0">
                        <div class="overflow-x-auto">
                            <table class="min-w-full border border-slate-200 rounded-lg overflow-hidden">
                                <thead class="bg-slate-50 text-left">
                                    <tr>
                                        <th class="px-3 py-2 font-semibold">Student</th>
                                        <th class="px-3 py-2 font-semibold">Section</th>
                                        <th class="px-3 py-2 font-semibold">Submission</th>
                                        <th class="px-3 py-2 font-semibold">Submitted</th>
                                        <th class="px-3 py-2 font-semibold">Grade</th>
                                        <th class="px-3 py-2 font-semibold">Feedback</th>
                                        <th class="px-3 py-2 font-semibold">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="s in submissions" :key="s.act_submission_id || s.student_id">
                                        <tr class="border-t border-slate-200 align-top transition-colors duration-150"
                                            :class="s.submission_file_path ? 'cursor-pointer hover:bg-blue-50' : ''"
                                            @click="if (s.submission_file_path) window.open('/' + s.submission_file_path, '_blank')">
                                            <td class="px-3 py-2">
                                                <div class="font-semibold" x-text="s.student_name || ('Student ' + s.student_id)"></div>
                                            </td>
                                            <td class="px-3 py-2" x-text="s.section || 'N/A'"></td>
                                            <td class="px-3 py-2">
                                                <span class="inline-flex items-center gap-2 rounded-full px-2.5 py-1 text-xs font-semibold"
                                                    :class="s.has_submission ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'">
                                                    <span class="h-2.5 w-2.5 rounded-full"
                                                        :class="s.has_submission ? 'bg-emerald-500' : 'bg-amber-500'"></span>
                                                    <span x-text="s.has_submission ? (s.submission_status || 'Submitted') : 'No submission'"></span>
                                                </span>
                                            </td>
                                            <td class="px-3 py-2" x-text="formatDateTime(s.submission_date)"></td>
                                            <td class="px-3 py-2">
                                                <div class="space-y-2" @click.stop>
                                                    <input class="lms-input w-full" type="number" x-model.number="s.tempScore" :disabled="!s.has_submission" placeholder="Enter score">
                                                </div>
                                            </td>
                                            <td class="px-3 py-2">
                                                <div class="space-y-2" @click.stop>
                                                    <input class="lms-input w-full" rows="1" x-model="s.tempFeedback" :disabled="!s.has_submission" placeholder="Add feedback">
                                                </div>
                                            </td>
                                            <td class="px-3 py-2">
                                                <div class="space-y-2">
                                                    <button class="lms-btn" @click.stop="saveRowGrade(s)" :disabled="!s.has_submission">Save</button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </div>
            </section>
        </main>

    </div>

    <script>
        function submissionsApp() {
            return {
                submissions: [],
                sections: [],
                sectionFilter: 'all',
                loading: false,
                activityTitle: '',

                async init() {
                    const params = new URLSearchParams(window.location.search);
                    this.class_id = params.get('class_id');
                    this.activity_id = params.get('activity_id');

                    if (!this.class_id || !this.activity_id) {
                        alert('Missing class_id or activity_id in URL');
                        return;
                    }

                    await this.load();
                },

                formatDateTime(v) {
                    if (!v) return 'n/a';
                    const d = new Date(v);
                    if (Number.isNaN(d.getTime())) return 'n/a';
                    return d.toLocaleString();
                },

                async load() {
                    this.loading = true;
                    try {
                        const query = this.sectionFilter && this.sectionFilter !== 'all' ? '?section=' + encodeURIComponent(this.sectionFilter) : '';
                        const res = await fetch(`/api/submissions/class/${encodeURIComponent(this.class_id)}/activity/${encodeURIComponent(this.activity_id)}${query}`);
                        if (!res.ok) throw new Error(await res.text());
                        const data = await res.json();
                        this.submissions = Array.isArray(data) ? data.map(item => ({
                            ...item,
                            tempScore: item.score ?? '',
                            tempFeedback: item.feedback || ''
                        })) : [];

                        // build unique sections
                        const secs = [...new Set(this.submissions.map(s => s.section).filter(Boolean))];
                        this.sections = secs;

                    } catch (err) {
                        console.error(err);
                        alert('Failed to load submissions');
                    } finally {
                        this.loading = false;
                    }
                },

                async saveRowGrade(sub) {
                    if (!sub.has_submission || !sub.act_submission_id) return;
                    try {
                        const res = await fetch(`/api/submissions/${encodeURIComponent(sub.act_submission_id)}/grade`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                score: sub.tempScore === '' ? null : sub.tempScore,
                                feedback: sub.tempFeedback || ''
                            })
                        });
                        if (!res.ok) throw new Error(await res.text());
                        await this.load();
                        alert('Grade saved');
                    } catch (err) {
                        console.error(err);
                        alert('Failed to save grade: ' + (err.message || err));
                    }
                }
            };
        }
    </script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LearnSync | Course Syllabus</title>
  <script src="../js/alpine_cdn.min.js" defer></script>
  <link rel="stylesheet" href="../css/tailwind.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/lms.css">
  <link rel="stylesheet" href="../css/design-system.css">
  <script src="../js/design-system.js" defer></script>
</head>

<body class="lms-shell teacher-accent font-sans text-sm" x-data="syllabusEditor()" x-init="load()">
  <main class="lms-page mx-auto max-w-5xl py-8">
    <section class="lms-hero">
      <div>
        <h1 class="lms-title">Course Syllabus</h1>
        <p class="lms-subtitle">Import a DOCX or text PDF, correct the draft, then approve it for your assigned subject.
        </p>
      </div>
      <a class="lms-btn lms-btn-secondary" :href="'subject.html?class_id=' + classId">Back to subject</a>
    </section>
    <p class="lms-empty text-red-600" x-show="error" x-text="error" role="alert"></p>
    <p class="lms-meta" x-show="message" x-text="message" role="status"></p>
    <section class="lms-panel mt-4">
      <div class="lms-task-top">
        <h2>Syllabus version</h2>
        <span class="lms-badge"
          x-text="draft ? 'Draft v' + draft.version : approved ? 'Approved v' + approved.version : 'No syllabus'"></span>
      </div>
      <div class="flex flex-wrap gap-2 mt-3">
        <input class="lms-input" type="file" accept=".docx,.pdf" @change="file=$event.target.files[0]">
        <button class="lms-btn" @click="importFile()" :disabled="!file || busy">Import draft</button>
        <button class="lms-btn lms-btn-secondary" @click="newDraft()" :disabled="busy">Start editable draft</button>
        <template x-if="approved">
          <div class="flex gap-2">
            <a class="lms-btn lms-btn-secondary" :href="exportUrl('docx')">Export DOCX</a>
            <a class="lms-btn lms-btn-secondary" :href="exportUrl('pdf')">Export PDF</a>
          </div>
        </template>
      </div>
      <p class="lms-meta mt-2" x-show="legacySource"
        x-text="'Existing uploaded syllabus: ' + legacySource.file_name + '. Import it again to make an editable draft.'">
      </p>
      <ul class="lms-list mt-3" x-show="draft && draft.import_warnings && draft.import_warnings.length">
        <template x-for="warning in draft?.import_warnings || []">
          <li class="text-amber-700" x-text="warning"></li>
        </template>
      </ul>
    </section>

    <template x-if="draft">
      <div>
        <section class="lms-panel mt-4">
          <h2>Course details</h2>
          <div class="lms-grid lms-grid-2 mt-3">
            <label>Course code<input class="lms-input" x-model="form.course_code"></label>
            <label>Course title<input class="lms-input" x-model="form.title"></label>
            <label>Credit units<input class="lms-input" x-model="form.units"></label>
            <label class="sm:col-span-2">Description<textarea class="lms-input" rows="3"
                x-model="form.description"></textarea></label>
            <label class="sm:col-span-2">Course learning outcomes, one per line<textarea class="lms-input" rows="4"
                :value="(form.outcomes || []).join('\n')"
                @input="form.outcomes=lines($event.target.value)"></textarea></label>
            <label class="sm:col-span-2">References, one per line<textarea class="lms-input" rows="4"
                :value="(form.references || []).join('\n')"
                @input="form.references=lines($event.target.value)"></textarea></label>
          </div>
        </section>

        <section class="lms-panel mt-4">
          <div class="lms-task-top">
            <h2>Chapters and topics</h2>
            <button class="lms-btn lms-btn-small" @click="addChapter()">Add chapter</button>
          </div>
          <p class="lms-meta">Topics may sit under a chapter or an optional lesson subsection. Reassign linked content
            before removing its place in the outline.</p>
          <template x-for="(chapter, ci) in form.chapters" :key="chapter.key">
            <div class="lms-card mt-3">
              <div class="lms-grid lms-grid-2"><label>Week or range<input class="lms-input"
                    x-model="chapter.week"></label>
                <label>Chapter title<input class="lms-input" x-model="chapter.title"></label>
              </div>
              <label>Chapter outcomes, one per line<textarea class="lms-input" rows="2"
                  :value="(chapter.outcomes || []).join('\n')"
                  @input="chapter.outcomes=lines($event.target.value)"></textarea></label>
              <label>Assessments, one per line<textarea class="lms-input" rows="2"
                  :value="(chapter.assessments || []).join('\n')"
                  @input="chapter.assessments=lines($event.target.value)"></textarea></label>
              <template x-for="(topic, ti) in chapter.topics || []" :key="topic.key">
                <div class="lms-panel mt-3">
                  <div class="lms-task-top"><strong x-text="'Topic ' + (ti + 1)"></strong>
                    <button class="lms-btn lms-btn-danger lms-btn-small" @click="chapter.topics.splice(ti,1)">Remove
                      topic</button>
                  </div>
                  <input class="lms-input" x-model="topic.title" placeholder="Topic title">
                  <div class="lms-grid lms-grid-3 mt-2">
                    <label>Expected outcomes<textarea class="lms-input" rows="2"
                        :value="(topic.outcomes || []).join('\n')"
                        @input="topic.outcomes=lines($event.target.value)"></textarea></label>
                    <label>Learning materials<textarea class="lms-input" rows="2"
                        :value="(topic.materials || []).join('\n')"
                        @input="topic.materials=lines($event.target.value)"></textarea></label>
                    <label>References<textarea class="lms-input" rows="2" :value="(topic.references || []).join('\n')"
                        @input="topic.references=lines($event.target.value)"></textarea></label>
                  </div>
                </div>
              </template>
              <template x-for="(subsection, si) in chapter.subsections || []" :key="subsection.key">
                <div class="lms-panel mt-3">
                  <div class="lms-task-top"><label>Lesson subsection<input class="lms-input" x-model="subsection.title"
                        placeholder="Subsection title"></label>
                    <button class="lms-btn lms-btn-danger lms-btn-small"
                      @click="chapter.subsections.splice(si,1)">Remove subsection</button>
                  </div>
                  <template x-for="(topic, ti) in subsection.topics || []" :key="topic.key">
                    <div class="lms-card mt-2">
                      <div class="lms-task-top"><strong x-text="'Topic '+(ti+1)"></strong><button
                          class="lms-btn lms-btn-danger lms-btn-small" @click="subsection.topics.splice(ti,1)">Remove
                          topic</button></div>
                      <input class="lms-input" x-model="topic.title" placeholder="Topic title">
                      <div class="lms-grid lms-grid-3 mt-2"><label>Outcomes<textarea class="lms-input"
                            :value="(topic.outcomes||[]).join('\n')"
                            @input="topic.outcomes=lines($event.target.value)"></textarea></label><label>Learning
                          materials<textarea class="lms-input" :value="(topic.materials||[]).join('\n')"
                            @input="topic.materials=lines($event.target.value)"></textarea></label><label>References<textarea
                            class="lms-input" :value="(topic.references||[]).join('\n')"
                            @input="topic.references=lines($event.target.value)"></textarea></label></div>
                    </div>
                  </template>
                  <button class="lms-btn lms-btn-secondary lms-btn-small mt-2" @click="addTopic(subsection)">Add topic
                    to subsection</button>
                </div>
              </template>
              <div class="flex gap-2 mt-3"><button class="lms-btn lms-btn-secondary lms-btn-small"
                  @click="addTopic(chapter)">Add topic</button><button class="lms-btn lms-btn-secondary lms-btn-small"
                  @click="addSubsection(chapter)">Add lesson subsection</button>
                <button class="lms-btn lms-btn-danger lms-btn-small" @click="form.chapters.splice(ci,1)">Remove
                  chapter</button>
              </div>
            </div>
          </template>
        </section>

        <section class="lms-panel mt-4">
          <h2>Grading rules</h2>
          <p class="lms-meta">Enter the weights from this subject's syllabus. Each group must total 100%.</p>
          <div class="lms-grid lms-grid-4 mt-3"><template x-for="name in ['attendance','quiz','activity','exam']"
              :key="name">
              <label><span x-text="name"></span><input class="lms-input" type="number" min="0" max="100" step="0.01"
                  x-model.number="rule.weights[name]"></label>
            </template></div>
          <p class="lms-meta" x-text="'Category total: ' + weightTotal() + '%'"></p>
          <div class="lms-grid lms-grid-2 mt-3">
            <label>Midterm share %<input class="lms-input" type="number" min="0" max="100" step="0.01"
                x-model.number="rule.period_shares.Midterm"></label>
            <label>Finals share %<input class="lms-input" type="number" min="0" max="100" step="0.01"
                x-model.number="rule.period_shares.Finals"></label>
            <label>Transmutation<select class="lms-select" x-model="rule.transmutation">
                <option value="raw">Raw percentage</option>
                <option value="sample_50_100">Sample sheet: 50 + half of raw percentage</option>
              </select></label>
            <label>Passing grade<input class="lms-input" type="number" min="0" max="100" step="0.01"
                x-model.number="rule.passing_threshold"></label>
            <label>Late attendance credit %<input class="lms-input" type="number" min="0" max="100" step="0.01"
                x-model.number="rule.attendance_late_percent"></label>
          </div>
          <p class="lms-meta"
            x-text="'Preview: 80% raw score becomes ' + (rule.transmutation==='sample_50_100' ? 90 : 80) + ' before category weighting.'">
          </p>
        </section>

        <section class="lms-panel mt-4"><label x-show="draft.import_warnings && draft.import_warnings.length">
            <input type="checkbox" x-model="acknowledge"> I reviewed the import warnings and corrected or accepted the
            draft.</label>
          <div class="flex flex-wrap gap-2 mt-3"><button class="lms-btn" @click="save()" :disabled="busy">Save
              draft</button>
            <button class="lms-btn lms-btn-secondary" @click="approve()" :disabled="busy">Approve syllabus</button>
          </div>
        </section>
      </div>
    </template>

    <section class="lms-panel mt-4" x-show="approved">
      <h2>Content links and section overrides</h2>
      <p class="lms-meta">Link modules and assessments to an approved topic when useful. Leave the link blank for
        course-wide items.</p>
      <template x-for="item in items.items" :key="item.item_type + item.item_id">
        <div class="lms-card mt-3">
          <strong x-text="item.item_type + ': ' + item.title"></strong>
          <div class="lms-grid lms-grid-2 mt-2">
            <label>Topic<select class="lms-select" x-model="item.topic_key" @change="saveLink(item)">
                <option value="">Course-wide</option><template x-for="topic in topics()" :key="topic.key">
                  <option :value="topic.key" x-text="topic.title"></option>
                </template>
              </select></label>
            <label>Section<select class="lms-select" x-model.number="item.section_id">
                <option value="">Choose section</option>
                <template x-for="section in items.sections" :key="section.section_id">
                  <option :value="section.section_id" x-text="section.section"></option>
                </template>
              </select></label>
            <label><input type="checkbox" x-model="item.visible"> Visible in selected section</label>
            <label>Section due date<input class="lms-input" type="datetime-local" x-model="item.due_at"></label>
          </div><button class="lms-btn lms-btn-secondary lms-btn-small mt-2" @click="saveOverride(item)">Save section
            override</button>
        </div>
      </template>
    </section>
  </main>
  <script>
    function syllabusEditor() {
      return {
        classId: new URLSearchParams(location.search).get('class_id'), teacherId: Number(localStorage.getItem('teacher_id')),
        draft: null, approved: null, legacySource: null, file: null, busy: false, error: '', message: '', acknowledge: false,
        form: {}, rule: {}, items: { items: [], sections: [] },
        lines(text) { return text.split(/\r?\n/).map(x => x.trim()).filter(Boolean); },
        async api(path, options = {}) {
          const res = await fetch(path, options); const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`); return data;
        },
        async load() {
          this.error = ''; try {
            const data = await this.api(`/api/faculty/${this.classId}/syllabus?teacher_id=${this.teacherId}`);
            this.draft = data.draft; this.approved = data.approved; this.legacySource = data.legacy_source;
            const current = this.draft || this.approved; if (current) { this.form = JSON.parse(JSON.stringify(current.content)); this.rule = JSON.parse(JSON.stringify(current.grading_rule)); }
            if (this.approved) await this.loadItems();
          } catch (e) { this.error = e.message; }
        },
        async loadItems() {
          this.items = await this.api(`/api/faculty/${this.classId}/syllabus/items?teacher_id=${this.teacherId}`);
          this.items.items.forEach(item => {
            const link = this.items.links.find(x => x.item_type === item.item_type && x.item_id === item.item_id);
            item.topic_key = link?.topic_key || ''; item.section_id = ''; item.visible = true; item.due_at = '';
          });
        },
        topics() { return (this.approved?.content?.chapters || []).flatMap(chapter => [...(chapter.topics || []), ...(chapter.subsections || []).flatMap(section => section.topics || [])]); },
        exportUrl(format) { return `/api/faculty/${this.classId}/syllabus/export/${format}?teacher_id=${this.teacherId}`; },
        async importFile() {
          this.busy = true; this.error = ''; try {
            const body = new FormData(); body.append('teacher_id', this.teacherId); body.append('file', this.file);
            await this.api(`/api/faculty/${this.classId}/syllabus/import`, { method: 'POST', body }); this.message = 'Imported as a draft. Review every field before approval.'; await this.load();
          } catch (e) { this.error = e.message; } finally { this.busy = false; }
        },
        async newDraft() {
          this.busy = true; try { await this.api(`/api/faculty/${this.classId}/syllabus/draft?teacher_id=${this.teacherId}`, { method: 'POST' }); await this.load(); }
          catch (e) { this.error = e.message; } finally { this.busy = false; }
        },
        addChapter() { this.form.chapters.push({ key: crypto.randomUUID(), week: '', title: '', topics: [], subsections: [], outcomes: [], materials: [], assessments: [], references: [] }); },
        addSubsection(chapter) { if (!chapter.subsections) chapter.subsections = []; chapter.subsections.push({ key: crypto.randomUUID(), title: '', topics: [] }); },
        addTopic(parent) { if (!parent.topics) parent.topics = []; parent.topics.push({ key: crypto.randomUUID(), title: '', outcomes: [], materials: [], references: [] }); },
        weightTotal() { return Object.values(this.rule.weights || {}).reduce((a, b) => a + Number(b || 0), 0); },
        async save() {
          this.busy = true; this.error = ''; try {
            await this.api(`/api/faculty/${this.classId}/syllabus/draft`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ teacher_id: this.teacherId, content: this.form, grading_rule: this.rule, acknowledge_warnings: this.acknowledge })
            });
            this.message = 'Draft saved.'; await this.load();
          } catch (e) { this.error = e.message; } finally { this.busy = false; }
        },
        async approve() {
          await this.save(); if (this.error) return; this.busy = true; try {
            await this.api(`/api/faculty/${this.classId}/syllabus/approve?teacher_id=${this.teacherId}`, { method: 'POST' });
            this.message = 'Syllabus approved. Any earlier grade publication must be reviewed again.'; await this.load();
          }
          catch (e) { this.error = e.message; } finally { this.busy = false; }
        },
        async saveLink(item) {
          try {
            await this.api(`/api/faculty/${this.classId}/syllabus/item-link`, {
              method: 'PUT', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ teacher_id: this.teacherId, item_type: item.item_type, item_id: item.item_id, topic_key: item.topic_key || null })
            }); this.message = 'Topic link saved.';
          }
          catch (e) { this.error = e.message; }
        },
        async saveOverride(item) {
          if (!item.section_id) { this.error = 'Choose a section first.'; return; } try {
            await this.api(`/api/faculty/${this.classId}/syllabus/section-override`, {
              method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
                teacher_id: this.teacherId, section_id: item.section_id, item_type: item.item_type,
                item_id: item.item_id, visible: item.visible, due_at: item.due_at || null
              })
            }); this.message = 'Section override saved.';
          } catch (e) { this.error = e.message; }
        }
      };
    }
  </script>
</body>

</html>
